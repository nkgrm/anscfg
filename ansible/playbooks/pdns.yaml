---
- name: Установка и настройка pdns и pdns-recursor
  hosts: srv
  become: true
  tasks:
    - name: Скачивание базы данных postgresql
      ansible.builtin.package:
      name: postgresql17-server
      state: present
      update_cache: yes

    - name: Инициация БД 
      shell: postgresql-17-setup initdb

    - name: изменение конфигурационных файлов
      ansible.builtin.lineinfile:
        path: /var/lib/postgresql/17/data/postgresql.conf
        rexerp: '^listen address ='
        line: 'listen address = *'

    - name:
